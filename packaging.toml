schema_version = 1

[app]
name = "Backup USB"
version = "0.1.0"
main_class = "backup_usb.Main"
icon_linux = "src/main/resources/icon.png"

[build]
mode = "distribution"
tasks = ["installDist"]
jar = "build/install/backup-usb/lib/backup-usb-{version}.jar"

[javafx]
version = "25.0.1"

[runtime]
modules = ["javafx.controls", "java.logging", "java.xml", "jdk.charsets"]
exclude_natives = ["libjfxwebkit.so", "libjfxmedia.so", "jfxwebkit.dll"]

[linux]
package_name = "backup-usb"
menu_group = "Office"
